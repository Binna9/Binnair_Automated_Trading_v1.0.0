[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binnair-trading-engine"
version = "1.0.0"
description = "BinnAIR Automated Trading Engine - Paper/Real trading execution engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "BinnAIR" }]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
engine = [
    "torch>=2.0",
    "timesfm[torch]",
]
# FinCast: clone https://github.com/vincent05r/FinCast-fts and `pip install -e .`
# then set BINNAIR_FINCAST_REPO / BINNAIR_FINCAST_CHECKPOINT. huggingface_hub for download script.
# FinCast: clone FinCast-fts + install requirements-fincast.txt (inference set).
# Dockerfile.engine installs that file and runs an import smoke check at build time.
fincast = [
    "torch>=2.0",
    "huggingface_hub>=0.20",
    "einops>=0.8",
    "einx>=0.3",
    "beartype>=0.14",
    "CoLT5-attention>=0.11",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
    "absl-py>=2.0",
    "utilsforecast>=0.2",
    "jax>=0.4",
]
redis = ["redis>=5.0"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
binnair-engine = "binnair_trading_engine.app.main:main"
binnair-api = "binnair_trading_engine.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
